<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <!--head-->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#EEF0EE" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14171A" media="(prefers-color-scheme: dark)" />
    <script>
      // Before first paint: mark JS as available (so JS-only controls are laid out from the start,
      // with no layout shift), and apply a saved theme so there's no flash.
      document.documentElement.classList.add('js');
      try {
        const t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch {}
    </script>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body id="top">
    <a class="skip-link" href="#projects">Skip the forest</a>
    <!--header-->
    <main class="page">
      <!--main-->
    </main>
    <!--footer-->

    <dialog class="panel" aria-labelledby="panel-title">
      <div class="panel-inner" data-lenis-prevent>
        <button class="panel-close" type="button" aria-label="Close">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
        <div class="panel-content"></div>
      </div>
    </dialog>
    <!--templates-->
  </body>
</html>
