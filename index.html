<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <!--head-->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#F3F1EA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141716" media="(prefers-color-scheme: dark)" />
    <script>
      // Before first paint: mark JS as available (so JS-only controls are laid out from the start,
      // with no layout shift), and apply a saved theme so there's no flash.
      document.documentElement.classList.add('js');
      try {
        const t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch {}
    </script>
    <script type="module" src="/src/main.ts"></script>
  </head>

    </main>
    <!--footer-->

  </body>
</html>
